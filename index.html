    <p class="hero-trans">From true knowledge of the sixteen categories — the means of knowledge, the objects of knowledge, doubt, purpose, example, tenet, the members of an argument, hypothetical reasoning, ascertainment, discussion, disputation, cavil, pseudo-reasons, quibble, futile rejoinder and points of defeat — the highest good is attained.</p>
